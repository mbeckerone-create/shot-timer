name: MultiTrack Recorder (macOS)
on:
  push:
    paths: ["MultiTrackRecorder/**", ".github/workflows/multitrack-mac.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./MultiTrackRecorder/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MultiTrackRecorder
          path: MultiTrackRecorder/build/MultiTrackRecorder.zip
